/* Layout: a printed-newspaper sheet — hero (side · lead · Incheon watch), ranked TOP5 strip, three desk sections, calendar, insight, action items. */
:root{
  --page:#efeeec;--paper:#ffffff;--ink:#171717;--ink-2:#454341;--muted:#777777;--rule:#e7e5e2;--rule-2:#d2d0cc;
  --red:#df2637;--red-ink:#ffffff;--red-soft:#fbe9eb;--chip:#f4f3f1;--mark:#ffe9a8;--img-dim:1;
  --f-sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0d0d0e;--paper:#161617;--ink:#f1f0ee;--ink-2:#c7c5c1;--muted:#93918d;--rule:#2a2a2c;--rule-2:#3b3b3e;
  --red:#ff5464;--red-ink:#160607;--red-soft:#3a1519;--chip:#1f1f21;--mark:#5a4a00;--img-dim:.88;color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0d0d0e;--paper:#161617;--ink:#f1f0ee;--ink-2:#c7c5c1;--muted:#93918d;--rule:#2a2a2c;--rule-2:#3b3b3e;
  --red:#ff5464;--red-ink:#160607;--red-soft:#3a1519;--chip:#1f1f21;--mark:#5a4a00;--img-dim:.88;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:1240px){.sheet{margin-block:28px;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.wide{padding-inline:0}
@media(min-width:768px){.wide{padding-inline:12px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:20px}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:32px;height:32px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}

: "고1·고2(학생부종합 준비)·학부모", "incheon": "해당 없음", "summary": "국민대 2027 학생부위주전형 가이드북에 실린 사례를 분석한 기사입니다. 융합바이오공학과에서 내신 3.02등급 지원자는 서류평가 상위 3%로 최초합격했고, 2.87등급 지원자는 상위 73%로 1단계에서 떨어졌습니다.", "change": "기사는 결과를 가른 요소로 활동의 주도성, 탐구의 깊이, 교과 선택과 학업적 성장을 꼽았습니다. 내신 숫자보다 학생부 기록의 질이 평가에 크게 작용한 사례입니다.", "status": "확정", "actions": {"student": "고1·2는 활동 수를 늘리기보다 하나의 탐구를 끝까지 이어 간 기록을 남기세요.", "parent": "내신 등급 차이만으로 학종 가능성을 단정하지 말고 학생부 기록 내용을 함께 살펴보세요.", "teacher": "교사는 학생의 주도적 탐구 과정과 그 뒤의 성장을 세특에 구체적으로 적어 주세요."}, "score": {"impact": 15, "urgency": 11, "utility": 18, "novelty": 11, "trust": 7}, "tags": ["#학생부종합", "#국민대", "#세특"], "crosscheck": "조사 단계 원문 확인(2026-11-06). 사례는 대학 가이드북 인용으로 개별 결과임.", "short": "국민대 학종 합격 사례", "alt": "물 위 봉우리는 작지만 물 아래 빨간 윤곽의 몸체가 훨씬 큰 빙산과 그 반대 빙산이 나란한 개념 그래픽. 등급보다 기록의 깊이가 평가를 가른 사례를 표현", "concept": "물 아래가 더 큰 빙산", "image": {"kind": "개념 그래픽", "composition": "twin-icebergs", "made": "ai", "key": "kookmin-hakjong", "sha256": "0f48d9576c687c03ad2a64c2c2faafa0f947d5ef377be3689efaf788d5419fff", "bytes": 13624, "mime": "image/webp", "width": 1200, "height": 900}, "img": "data:image/webp;base64,UklGRjA1AABXRUJQVlA4ICQ1AABwyAGdASqwBIQDPmEwlUgkIychoNTIuOAMCWlu+EPaGADtOcm4gd1C7Zgdlnv8zrk/ff6T+y/9v/ajpVd9fpv54/JT5AfQB79+If5v6M/gh8K/Ov8B/i/3Z/u3///+n4I9AnmAfxD+qf8P+wflJ3Bf+r6AP9F/j/3S93P0dfuD/2P8x8AH8g/qX/o7Ez0BP53/r//z63n7Kf735Tf2N/br/mfIr+zf/79gD/z+oB1P/ZP/e+qP47/Df6r+8+ff4z7fvtjzxYo/yb7r/zv8D7Yey/948QX8r/r3qyPdvc9AXczfb+Z/229gDgp/yHqCfpz0itHH1P7C4Q70+Cn36DmwfSW7SW7SW7SW7SW7SW7SW7SW7SW7SW7SW7SXEzYPpLdpLdj+WqnwU+/Qc2D6S3aS3Y/lqp6RsrP6S4mbB9JbtKRGjFPgp9+g5sH0lu0lu0lu0mAgG7SW7U41u0kl1T4Kffo1NjLdpJLqnwU/A9g+kt2kt2kxgETRinwkD33hLdpLdqcvGtytgKevT3z9FTQIlyD0jbRH0lu0lu0lux/LVT4Kffol/U41u0lxM2D6S4mbAcSeDNaUSW5XvTHwcOg5sH0lu0lu0lu0mAbtJbtKz+tEfSW7woW5btJbtJbsY3cFSVqcqMSzosuG9PSNkt2kt2kkuqhM9Pgp9+g5sHx/LVT5lZ8FPv0HNV7w4DSFuRbG9KkDyhmI7COg5sH0lu0X7VT4KffVgnMYvvLRftVPfbghTwvT4KetEQZI2si7E4oEkUW22cxkt2kksOJbtJbtJbtJbtJbtF+1S34mbB9JbtJF3hwY5qfuyc1qobvX5Dh1g/pi1U+CntFNVPgp9+g5sH0luVDMaRW+7SW7  경험을 잇는 답변 구조를 연습시키세요."}, "score": {"impact": 13, "urgency": 14, "utility": 16, "novelty": 10, "trust": 6}, "tags": ["#수시면접", "#학생부", "#면접준비"], "crosscheck": "조사 단계 원문 확인(2026-11-06). 기고문(제안).", "short": "면접은 나만의 서사로", "alt": "씨앗·책·플라스크를 차례로 꿰고 지나 빈 의자에 닿는 빨간 실 한 가닥의 개념 그래픽. 경험을 하나의 이야기로 잇는 면접 답변을 표현", "concept": "경험을 꿰는 실", "image": {"kind": "개념 그래픽", "composition": "thread-through-objects", "made": "ai", "key": "interview-narrative", "sha256": "b36c93f80a8006d52e89429dde96d395a423a7f658ed99ab847272f63d75b211", "bytes": 14832, "mime": "image/webp", "width": 1200, "height": 900}, "img": "data:image/webp;base64,UklGRug5AABXRUJQVlA4INw5AABw0QGdASqwBIQDPmEwlUgkIychoROIuOAMCWlu5VexREItOMnvje/D/G/3n9pP7V+0/zU1h+y/gP8keljOp67/Of9v+y/4P3i/6T1B/w/+3f9b3AP4F/CP6l/Zv7v/7P6z86P836kv6X6Af5H/Xv+7/ff3/+fv00/971AP9J/0fX99QD/9+oB5ZP7pfCR+3H7TfAp/Nv8B/9esA///Xb9n/976Z/jn7//hP7z+Lnke9s33L/uWil/Ifwb+j/xn46/NL/B79flf83ewF+Rfy3/df1DgK51vUF70f9L/H+rD+L/0fRb+P/xX/A+0n7Af1J/1f3H+154gX2j/o+wF/NP6//4P7h7D31n/qvWd+g/6f9mPgf/n/91/YftehUxu1gZTVT4oWbdrAymqnxQs27WBlNVPihZt2sDKaqfFCzcmcr19VPihZtwxT4oWbdqYLRNVPihZgKdxrdfmBcRm3a0KZWqfFC0sj18HGhsvpqm1S5ptVPig5pPnpqpk13HEGU1UyxnawMS518CnhUDZdmWVVTVsIG3awMpqp8UenNQLtXwKR7VNqlzTh1SULNu2boELL6aGzRpZGll9NU2qnqJqrlSoG3bN0GVOKkD6CQNvIBqaHsAHYp8UM0Enr6qfFCzbtYMqcUqBuTINTRAymqny9u1gZTVT4oWbdrAymqnxQwumhsvrrdv/EmDChZt2NT4oWsJ6CqbVT4VvmI7ap6iaqeopn/bqptVPij1LI9bn1gOKeFQNljWI9qm1U9Q+elAASiXNNqp9BMzpCy+mqbc+8Tavdlpvg2PpqhOqBt2sDKaqfE2qnxQs2XP46miBlMHFAAegqbc0OGlNWu9qbH+sBmW2BlNUswAegoUFqp6iapc02qnxNgZT05fqp8X2Z7tTBkC9qm1U+KFm3awMnz00KCwcaptVPihZt2sDKaqenI/pOqpqp8ULNu1gZTTuqm1S5ptVM1TVT4oWbdrAymqnxQs27WBlNVM1TVT4oWbdqYMFb5lNVPihZt2sCFTtU+KFm3awMpqp6iaqeomndU2/01TaqfFCuKfPTVNqlzNv9NU2qnxQs27GlyNl9NDZfTVNqp8ULMBWIDbtYGT26p6iaqeomqnxQs27UwYTaqenL/TVNqp8ULNu1gZTVT4oWlkevqp8ULNl2afFCzbsXbY7W1V3YAp3GqbVT4oWbdjU+JtUvE0GC0TVT4oWbdjS5peemqbTwrjaqeomncgAPQVTapc0vPVxl8h56aG1LtYGU1S5ptVPibVT4VvmU1U+KFm3awMpq2EDmgxT4m1S53X8gdPvNCurAW1PGtaD32nhseZyPCQ5wZWBCyOpc02ncf/G1T4oWbcL6Y const items = DATA.items.map((it,i)=>({...it, idx:i}));

const total = it => Object.values(it.score).reduce((a,b)=>a+b,0);

const pic = (it, ratio="") => `<button class="pic" type="button" data-open="${it.id}" aria-label="${esc(it.title)} 브리핑 보기"${ratio}><img src="${it.img}" alt="${esc(it.alt)}" decoding="async"></button>`;
const lbl = it => `<div class="lbl"><span>${esc(it.cat)}</span>${isIC(it)?'<span class="ic">#인천</span>':""}</div>`;
const st = it => `<span class="st ${it.status==="전망"?"est":it.status==="제안"?"prop":""}">${esc(it.status)}</span>`;
const fresh = it => `<span class="fresh ${it.freshness==="당일 신규"?"new":""}">${esc(it.freshness)}</span>`;
const dt = it => `<time class="date" datetime="${it.published.slice(0,10)}">${md(it.published)}(${wk(it.published)}) ${esc(it.published.slice(11))}</time>`;
const tlink = it => `<a href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}<span class="ext" aria-label="원문 기사, 새 창">↗</span></a>`;

const NAV = [["home","홈"],["policy","정책·통계"],["admission","대입·학생부"],["career","진로·AI"],["incheon","인천"],["calendar","캘린더"],["insight","인사이트"],["actions","Action Items"],["about","편집 원칙"]];

function card(it){

const refBtns = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<button type="button" data-open="${it.id}">${esc(it.short||it.title)}</button>`).join("");
function insight(){

}

  return `<div class="syn">${col("학생","STUDENTS",a.student)}${col("학부모","PARENTS",a.parent)}${col("교사","TEACHERS",a.teacher)}</div>`;

function calendar(){
  const days={}; ED.calendar.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  const ev = e => { const scope=e.scope==="인천"?'<span class="sc ic">인천</span>':e.second?'<span class="sc u">대학·2차 출처</span>':`<span class="sc">${esc(e.scope)}</span>`;
    const label = e.ref?`<button type="button" data-open="${e.ref}">${esc(e.event)}</button>`:`<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.event)}<span class="ext">↗</span></a>`;
    return `<li>${scope}<span>${label}</span></li>`; };
  const html = Object.entries(days).map(([d,list])=>`<div class="day ${d===ED.date?"today":""}"><div class="d"><b>${md(d)}</b><span>${wk(d)}${d===ED.date?" · 오늘":""}</span></div><ul>${list.map(ev).join("")}</ul></div>`).join("");
  const later = ED.later.map(e=>`<span><b>${md(e.date)}(${wk(e.date)})</b> ${e.ref?`<button class="more" type="button" data-open="${e.ref}" style="font-weight:600">${esc(e.event)}</button>`:esc(e.event)}</span>`).join("");
  return `<div class="cal">${html}</div><div class="later"><b style="color:var(--muted)">14일 이후</b>${later}</div>`;
}
function sectionBlock(s, withHead=true){
  const list=s.order.map(id=>byId[id]);
  return `${withHead?`<div class="sh"><h2 id="h-${s.key}">${esc(s.en)}<span>${esc(s.ko)}</span></h2><span class="cnt">${list.length}건</span></div>`:""}<div class="grid ${list.length===5?"five":""}">${list.map(card).join("")}</div>`;
}

  const top5=[...items].sort((a,b)=>total(b)-total(a)||b.score.impact-a.score.impact).slice(0,5);
  const ic=[...items.filter(isIC)].sort((a,b)=>total(b)-total(a));
  let h=`<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="TOP 2·3">${side.map(it=>`<article>${pic(it)}${lbl(it)}<h3 class="t">${tlink(it)}</h3><div class="m" style="display:flex;gap:8px;flex-wrap:wrap">${dt(it)}${st(it)}</div><div><button class="more" type="button" data-open="${it.id}">브리핑 보기 →</button></div></article>`).join("")}</div>
   <div class="c lead">${pic(lead)}<span class="rank">TODAY'S No.1 · ${esc(lead.cat)}</span><h2 class="t">${tlink(lead)}</h2><p>${esc(lead.summary)}</p><div class="by">${dt(lead)}<span>·</span><span>${esc(lead.outlet)}</span>${st(lead)}${fresh(lead)}</div><button class="more" type="button" data-open="${lead.id}">브리핑 보기 →</button></div>
   <aside class="icw" aria-labelledby="h-ic"><h2 id="h-ic">INCHEON WATCH<span>인천 ${ic.length}건</span></h2>${ic.map(it=>`<button class="row" type="button" data-open="${it.id}"><span><b>${esc(it.title)}</b>${dt(it)}</span>${pic(it).replace('<button class="pic"','<span class="pic"').replace('</button>','</span>').replace(/ type="button"| data-open="[^"]+"| aria-label="[^"]+"/g,"")}</button>`).join("")}</aside>
  </section>
  <section class="top5" aria-labelledby="h-top5"><h2 id="h-top5">TODAY'S TOP 5<span>100점 기준 · 영향 30 · 시급성 25 · 실용성 20 · 신규성 15 · 신뢰도 10</span></h2>${top5.map((it,i)=>`<button type="button" data-jump="${it.id}"><span class="n">${i+1}</span><span><b>${esc(it.short||it.title)}</b><small>${total(it)}점 · ${esc(it.cat)}${isIC(it)?" · 인천":""}</small></span></button>`).join("")}</section>`;
  ED.sections.forEach(s=>{ h+=`<section class="sec" aria-labelledby="h-${s.key}">${sectionBlock(s)}</section>`; });
  h+=`<section class="sec" aria-labelledby="h-cal"><div class="sh"><h2 id="h-cal">Calendar<span>향후 14일 · ${md(ED.calendar[0].date)} ~ ${md(ED.calendar[ED.calendar.length-1].date)}</span></h2></div>${calendar()}</section>`;
  h+=`<section class="sec" aria-labelledby="h-ins"><div class="sh"><h2 id="h-ins">Expert Insight<span>이번 호 종합 · 편집 분석은 사실과 구분해 표시</span></h2></div>${insight()}</section>`;
  h+=`<section class="sec" aria-labelledby="h-act"><div class="sh"><h2 id="h-act">Action Items<span>오늘 할 일 · 대상별</span></h2></div>${actions()}</section>`;
  return h;
}
const pageHead=(en,t,p)=>`<div class="ph"><span class="lbl">${esc(en)}</span><h1>${esc(t)}</h1><p>${p}</p></div>`;
function viewSection(k){
  const s=ED.sections.find(x=>x.key===k); setNav(k);
  const all=items.filter(i=>s.cats.includes(i.cat)).sort((a,b)=>total(b)-total(a));
  return `<div class="page">${pageHead(s.en,s.ko,`${all.length}건 · 점수순`)}<div class="grid">${all.map(card).join("")}</div></div>`;
}
function viewIncheon(){
  setNav("incheon"); const l=items.filter(isIC).sort((a,b)=>total(b)-total(a));
  return `<div class="page">${pageHead("Incheon Watch","인천 주요 뉴스",`${l.length}건`)}<div class="grid">${l.map(card).join("")}</div><p class="secnote">인천에도 적용되는 전국 정책은 기사마다 '인천 적용 전국정책'으로 표시했습니다(${items.filter(i=>i.incheon==="인천 적용 전국정책").length}건).</p></div>`;
}
function viewSearch(q){
  setNav(""); const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=items.filter(it=>{const hay=[it.title,it.summary,it.change,it.cat,it.outlet,it.audience,(it.tags||[]).join(" ")].join(" ").toLowerCase();return terms.every(t=>hay.includes(t));});
  let g = l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<p class="empty">‘${esc(q)}’에 맞는 기사가 없습니다. 다른 낱말로 검색해 보세요.</p>`;
  if(terms.length){ const re=new RegExp("("+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi"); g=g.replace(/(<h3 class="t"><a [^>]+>)([^<]*)/g,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>")); }
  return `<div class="page">${pageHead("Search",q?`‘${q}’ 검색 결과`:"전체 기사",`${l.length}건`)}${g}</div>`;
}
function scoreBars(it){
  const rows=[["영향",it.score.impact,30],["시급성",it.score.urgency,25],["실용성",it.score.utility,20],["신규성",it.score.novelty,15],["신뢰도",it.score.trust,10]];
  return `<div class="score">${rows.map(([n,v,m])=>`<div class="r"><span>${n}</span><span class="tr" style="width:${m/30*100}%"><i style="width:${v/m*100}%"></i></span><span>${v}/${m}</span></div>`).join("")}<div class="tot">합계 ${total(it)}점 / 100</div></div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다.</p></div>`;
  setNav(""); const prev=items[it.idx-1], next=items[it.idx+1];
  return `<div class="page"><article class="post"><button class="back" type="button" data-back>← 이전 화면</button>
   <div class="head">${lbl(it)}<h1>${tlink(it)}</h1><div class="by">${dt(it)}<span>·</span><b>${esc(it.outlet)}</b>${st(it)}${fresh(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc(it.alt)}"></div>
   <div class="cap">개념 그래픽 · ${esc(it.concept)} — 기사 내용을 바탕으로 ${it.image&&it.image.made==="ai"?"AI 이미지 생성 도구로 만든":"코드로 그린"} 이미지이며 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>게시</dt><dd>${fmt(it.published)}(${wk(it.published)})</dd></div><div><dt>대상</dt><dd>${esc(it.audience)}</dd></div><div><dt>지역 적용</dt><dd>${esc(it.incheon)}</dd></div><div><dt>확인일</dt><dd>${fmt(DATA.edition.checked)}</dd></div></dl>
   <h2>요약</h2><p>${esc(it.summary)}</p>
   <h2>기존 대비 변화</h2><p>${esc(it.change)}</p>
   <h2>대상별 대응 메모</h2><div class="roles"><div><b>학생</b><span>${esc(it.actions.student)}</span></div><div><b>학부모</b><span>${esc(it.actions.parent)}</span></div><div><b>교사</b><span>${esc(it.actions.teacher)}</span></div></div>
   <h2>중요도 평가</h2>${scoreBars(it)}
   <h2>검증 메모</h2><p class="note">${esc(it.crosscheck)}</p><div class="tags">${(it.tags||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<button type="button" data-open="${prev.id}"><small>← 이전 기사</small>${esc(prev.title)}</button>`:"<span></span>"}${next?`<button class="nx" type="button" data-open="${next.id}"><small>다음 기사 →</small>${esc(next.title)}</button>`:"<span></span>"}</nav>
  </article></div>`;
}
function viewBlock(k){
  const m={calendar:["Calendar","향후 14일 캘린더",`${md(ED.calendar[0].date)} ~ ${md(ED.calendar[ED.calendar.length-1].date)} · 원문에서 확인한 날짜만 실었습니다`,calendar],insight:["Expert Insight","이번 호 종합","이번 호 기사를 근거로 정리한 흐름·신호·편집 분석",insight],actions:["Action Items","오늘 할 일","학생·학부모·교사별 대응",actions]}[k];
  setNav(k); return `<div class="page">${pageHead(m[0],m[1],m[2])}${m[3]()}</div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <h2>수집과 검증</h2><p>${fmt(ED.date)} 0시 이후 게시된 기사와 공식 공지를 우선했고, 부족한 분야는 10월 20~21일 게시분으로 보충해 '이전 발표·보충'으로 표시했습니다. 후보 ${ED.counts.candidates}건을 원문으로 열어 중복을 걷어낸 ${ED.counts.verified}건 가운데 ${items.length}건을 골랐습니다. TOP5 기사는 원문을 한 번 더 열어 수치를 재확인했습니다.</p>
  <h2>선정 기준</h2><p>영향 30, 시급성 25, 실용성 20, 신규성 15, 신뢰도 10의 100점 기준으로 평가했습니다. 점수가 같거나 가까우면 인천 소식을 먼저 골랐고, 인천 기사에는 고정 할당량을 두지 않았습니다.</p>
  <h2>확정·전망·제안</h2><p><span class="st">확정</span> 발표·의결된 사실, <span class="st est">전망</span> 연구소·기관의 예측, <span class="st prop">제안</span> 컨설팅·기고의 권고입니다. 편집 분석은 인사이트의 '편집 분석' 칸에만 따로 실었습니다.</p>
  <h2>조회하지 못한 출처</h2><ul class="plain">${ED.failures.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
  <h2>검토 후 제외한 후보</h2><ul class="plain">${ED.excluded.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
  <h2>이미지</h2><p>모든 기사 이미지는 기사의 핵심 관계를 하나의 시각적 비유로 정리한 개념 그래픽입니다. AI 이미지 생성 도구(Codex)로 만들고, 생성에 실패한 기사만 코드로 그렸습니다. 기사 상세 화면의 캡션에 제작 방식을 표시합니다. 이미지 안에 숫자를 넣을 때는 원문에서 확인한 값만 썼고, 실제 현장 사진이나 기관 로고는 쓰지 않았습니다.</p></article></div>`;
}

let history=[];
function render(view, opts={}){
  const m=$("#main"); let html;
  if(view.startsWith("a-")) html=viewArticle(view.slice(2));
  else if(view.startsWith("q:")) html=viewSearch(view.slice(2));
  else if(["policy","admission","career"].includes(view)) html=viewSection(view);
  else if(view==="incheon") html=viewIncheon();
  else if(["calendar","insight","actions"].includes(view)) html=viewBlock(view);
  else if(view==="about") html=viewAbout();
  else { html=viewHome(); view="home"; }
  if(!opts.noPush && history[history.length-1]!==view) history.push(view);
  m.innerHTML=html;
  document.title=(view.startsWith("a-")&&byId[view.slice(2)]?byId[view.slice(2)].short+" — ":"")+"EduTrend Daily Brief";
  if(!opts.keepScroll){ window.scrollTo(0,0); if(view!=="home") m.focus({preventScroll:true}); }
}
function jump(id){
  if(current!=="home") render("home");
  const el=document.getElementById("c-"+id); if(!el){ render("a-"+id); return; }
  el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]"); if(go){ e.preventDefault(); render(go.dataset.go); return; }
  const op=e.target.closest("[data-open]"); if(op){ e.preventDefault(); render("a-"+op.dataset.open); return; }
  const jp=e.target.closest("[data-jump]"); if(jp){ e.preventDefault(); const id=jp.dataset.jump; (ED.lead===id||ED.side.includes(id))?render("a-"+id):jump(id); return; }
  if(e.target.closest("[data-back]")){ history.pop(); render(history.pop()||"home"); }
});
const sb=$("#searchbar");
$("#searchBtn").addEventListener("click",()=>{ sb.hidden=!sb.hidden; $("#searchBtn").setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); });
sb.addEventListener("submit",e=>{ e.preventDefault(); render("q:"+$("#q").value.trim()); });
const root=document.documentElement, tb=$("#themeBtn");
function curDark(){ const t=root.dataset.theme; return t? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function syncTheme(){ const d=curDark(); tb.setAttribute("aria-pressed",String(d)); tb.setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
tb.addEventListener("click",()=>{ root.dataset.theme=curDark()?"light":"dark"; try{localStorage.setItem("eduscope-theme",root.dataset.theme);}catch(_){} syncTheme(); });
try{ const t=localStorage.getItem("eduscope-theme"); if(t==="dark"||t==="light") root.dataset.theme=t; }catch(_){}
syncTheme();
const start=(location.hash||"").replace(/^#/,"");
render(/^[A-Za-z0-9._~-]+$/.test(start)?start:"home");
</script>
